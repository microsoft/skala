name: SkalaXC

on:
  pull_request:
    paths:
      - 'SkalaXC/**'
      - 'website/skalaxc/**'
      - '.github/workflows/skalaxc-ci.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'tests/*skalaxc*'
  push:
    branches: [main]
    paths:
      - 'SkalaXC/**'
      - 'website/skalaxc/**'
      - '.github/workflows/skalaxc-ci.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'tests/*skalaxc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: skalaxc-python-host
            mpi: 'OFF'
            submodules: 'false'
          - environment: skalaxc-python-mpi
            mpi: 'ON'
            submodules: recursive
    env:
      OMP_NUM_THREADS: '4'
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,tcp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: ${{ matrix.submodules }}
      - uses: ./.github/actions/setup-pixi
        with:
          environment: ${{ matrix.environment }}
      - name: Configure
        run: >-
          cmake -S SkalaXC -B SkalaXC/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSKALAXC_BUILD_TESTS=ON -DSKALAXC_BUILD_EXAMPLES=ON
          -DSKALAXC_BUILD_FORTRAN=ON
          -DSKALAXC_ENABLE_MPI=${{ matrix.mpi }}
          -DMPIEXEC_PREFLAGS=--oversubscribe
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/SkalaXC/install
      - name: Build and test
        run: |
          cmake --build SkalaXC/build --parallel 2
          ctest --test-dir SkalaXC/build --output-on-failure --no-tests=error
          cmake --install SkalaXC/build
          SkalaXC/build/examples/skalaxc_eval_cpp SkalaXC/tests/ref_data/skala_he_def2qzvp_pbe_uks.hdf5 PBE
          SkalaXC/build/examples/skalaxc_eval_c SkalaXC/tests/ref_data/skala_he_def2qzvp_lda_uks.hdf5 LDA
          SkalaXC/build/examples/skalaxc_eval_fortran SkalaXC/tests/ref_data/skala_he_def2qzvp_tpss_uks.hdf5 TPSS
      - name: Installed consumer
        run: |
          cmake -S SkalaXC/tests/installed -B SkalaXC/build-installed -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/SkalaXC/install"
          cmake --build SkalaXC/build-installed
          ctest --test-dir SkalaXC/build-installed --output-on-failure --no-tests=error
      - name: Install Python binding against the tested native package
        env:
          SkalaXC_DIR: ${{ github.workspace }}/SkalaXC/install/lib/cmake/SkalaXC
          SKALAXC_PYTHON_LAYOUT: WHEEL
        run: python -m pip install SkalaXC/python --no-build-isolation --no-deps
      - name: Initialize upstream Python test fixtures
        run: git submodule update --init SkalaXC/external/GauXC
      - name: Test installed Python API and generated stubs
        env:
          EXPECT_MPI: ${{ matrix.mpi }}
        run: |
          python -c "import os, skalaxc; assert skalaxc.HDF5_ENABLED and not skalaxc.CUDA_ENABLED; assert skalaxc.MPI_ENABLED == (os.environ['EXPECT_MPI'] == 'ON')"
          python -m pytest -v -ra SkalaXC/python/tests --ignore=SkalaXC/python/tests/test_mpi.py
          python SkalaXC/python/examples/evaluate.py SkalaXC/tests/ref_data/skala_he_def2qzvp_pbe_uks.hdf5 PBE
      - name: Test MPI binding on two ranks
        if: matrix.mpi == 'ON'
        timeout-minutes: 10
        run: |
          mpiexec --oversubscribe -n 2 python -m pytest -p no:randomly -v -ra SkalaXC/python/tests/test_mpi.py
          mpiexec --oversubscribe -n 2 python SkalaXC/python/examples/evaluate.py SkalaXC/tests/ref_data/skala_he_def2qzvp_pbe_uks.hdf5 PBE
      - name: Test fixed-density PySCF parity
        if: matrix.mpi == 'OFF'
        run: python -m pytest -v tests/test_pyscf_skalaxc_parity.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-pixi
        with:
          environment: skalaxc-package
      - name: Render multi-output package recipe
        run: rattler-build build --recipe SkalaXC/recipe/recipe.yaml --target-platform linux-64 --render-only

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-pixi
        with:
          environment: docs
      - name: Build separate SkalaXC guide with the website
        run: sphinx-build -W -b html -D nb_execution_mode=off website website/_build/html
