name: Skala tests

on:
  push:
    branches: [main]
    paths: &skala-test-paths
      - '.github/workflows/skala-test.yml'
      - '.github/actions/setup-pixi/**'
      - 'pixi.lock'
      - 'pixi.toml'
      - 'pyproject.toml'
      - 'skala/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths: *skala-test-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    env:
      OMP_NUM_THREADS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            environment: test-py311-pyscf214-torch213
          - runner: ubuntu-latest
            environment: test-py312-pyscf214-torch212
          - runner: ubuntu-latest
            environment: test-py312-pyscf214-torch213
          - runner: ubuntu-latest
            environment: test-py313-pyscf214-torch213
          - runner: ubuntu-24.04-arm
            environment: test-py312-pyscf214-torch213
          - runner: macos-15
            environment: test-py312-pyscf214-torch213

    name: "${{ matrix.environment }} @ ${{ matrix.runner }}"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: ${{ matrix.environment }}

    - name: Run tests with coverage
      run: >-
        pytest -v --doctest-modules --cov=skala --cov-report=xml
        --cov-report=term-missing --cov-report=html --durations=50
        --durations-min=1.0 skala/src/skala/ skala/tests/

    - name: Print CPU diagnostics on failure
      if: ${{ failure() }}
      uses: ./.github/actions/cpu-diagnostics

  # GPU runners are self-hosted, so on pull requests only run them for same-repository
  # changes that can affect the GPU environments or GPU code.
  gpu-changes:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.filter.outputs.gpu }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 2

    - name: Detect GPU-relevant changes
      id: filter
      run: |
        # The checkout is the PR merge commit; its first parent is the base branch.
        if git diff --name-only HEAD^1 HEAD | grep -qE '^(pixi\.(toml|lock)|\.github/workflows/skala-test\.yml|\.github/actions/setup-pixi/|skala/src/skala/gpu4pyscf/|skala/tests/test_gpu4pyscf_|tools/verify_gpu\.py$)'; then
          echo "gpu=true" >> "$GITHUB_OUTPUT"
        else
          echo "gpu=false" >> "$GITHUB_OUTPUT"
        fi

  gpu-test:
    needs: gpu-changes
    if: >-
      !cancelled() && (
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.gpu-changes.outputs.gpu == 'true')
      )
    runs-on: ${{ matrix.runner }}
    env:
      OMP_NUM_THREADS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: gpu-cuda12-torch212
            runner: microsoft-skala-small-gpu-pool
          - environment: gpu-cuda12-torch213
            runner: microsoft-skala-small-gpu-pool
          - environment: gpu-cuda13-torch213
            runner: microsoft-skala-gpu-pool
    name: "${{ matrix.environment }}"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: ${{ matrix.environment }}
        pixi-bin-path: ${{ runner.temp }}/bin/pixi
        post-cleanup: true

    - name: Verify CUDA is available
      run: python tools/verify_gpu.py

    - name: Run GPU tests
      run: >-
        pytest -v -m 'gpu and not profiling and not model_benchmark' skala/tests/
      env:
        CUDA_LAUNCH_BLOCKING: 1

    - name: Run GPU doctests
      run: pytest -v --doctest-modules skala/src/skala/gpu4pyscf/

  profiling:
    name: "Profiling (Python=3.12 & PySCF=2.14 & PyTorch=2.13)"
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 4
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: test-py312-pyscf214-torch213

    - name: Run profiling tests
      run: pytest -v -m profiling skala/tests/