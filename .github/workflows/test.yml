name: Tests

on:
  push:
    branches: [main]
    paths: &test-paths
      - '.github/workflows/test.yml'
      - '.pre-commit-config.yaml'
      - 'docs/benchmark/**'
      - 'gauxc/**/*.py'
      - 'model/**/*.py'
      - 'pixi.lock'
      - 'pixi.toml'
      - 'pyproject.toml'
      - 'skala/**'
      - '**/*.py'
      - '**/*.pyi'
      - '**/*.ipynb'
  pull_request:
    branches: [main]
    paths: *test-paths

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        environments: lint
        activate-environment: true
        locked: true
        cache: false

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            environment: test-py311-pyscf214-torch213
          - runner: ubuntu-latest
            environment: test-py312-pyscf214-torch212
          - runner: ubuntu-latest
            environment: test-py312-pyscf214-torch213
          - runner: ubuntu-latest
            environment: test-py313-pyscf214-torch213
          - runner: ubuntu-24.04-arm
            environment: test-py312-pyscf214-torch213
          - runner: macos-14
            environment: test-py312-pyscf214-torch213

    name: "${{ matrix.environment }} @ ${{ matrix.runner }}"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        lfs: true

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        environments: ${{ matrix.environment }}
        activate-environment: true
        locked: true
        cache: false

    - name: Run tests with coverage
      run: >-
        pytest -v --doctest-modules --cov=skala --cov-report=xml
        --cov-report=term-missing --cov-report=html --durations=50
        --durations-min=1.0 skala/src/skala/ skala/tests/

    - name: Print CPU diagnostics on failure
      if: ${{ failure() }}
      uses: ./.github/actions/cpu-diagnostics

  component-test:
    name: Model, GauXC, and benchmark unit tests
    runs-on: ubuntu-latest
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        lfs: true

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        environments: lint
        activate-environment: true
        locked: true
        cache: false

    - name: Run component unit tests
      run: >-
        pytest -v model/tests/test_model.py model/tests/test_utils.py
        gauxc/tests/ docs/benchmark/tests/

  gpu-test:
    runs-on: microsoft-skala-gpu-pool
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    strategy:
      fail-fast: false
      matrix:
        environment:
          - gpu-cuda12-torch212
          - gpu-cuda12-torch213
          - gpu-cuda13-torch213
    name: "${{ matrix.environment }}"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        pixi-bin-path: ${{ runner.temp }}/bin/pixi
        environments: ${{ matrix.environment }}
        activate-environment: true
        locked: true
        cache: false
        post-cleanup: true

    - name: Verify CUDA is available
      run: python tools/verify_gpu.py

    - name: Run GPU tests
      run: >-
        pytest -v -m 'gpu and not profiling and not model_benchmark' skala/tests/
      env:
        CUDA_LAUNCH_BLOCKING: 1


    - name: Run GPU doctests
      run: pytest -v --doctest-modules skala/src/skala/gpu4pyscf/

  profiling:
    name: "Profiling (Python=3.12 & PySCF=2.14 & PyTorch=2.13)"
    runs-on: ubuntu-latest
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        environments: test-py312-pyscf214-torch213
        activate-environment: true
        locked: true
        cache: false

    - name: Run profiling tests
      run: pytest -v -m profiling skala/tests/
