name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
      with:
        environment-file: environment-cpu.yml
        environment-name: skala
        # Recreate native environments per runner to avoid restoring CPU-specific binaries.
        cache-environment: false
        cache-downloads: true

    - name: Install package in development mode
      run: |
        pip install -e . --no-deps
      shell: micromamba-shell {0}

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files
      shell: micromamba-shell {0}

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        pyscf-version: ["2.11", "2.14"]
        include:
          - runner: ubuntu-24.04-arm
            python-version: "3.12"
            pyscf-version: "2.11"
          - runner: macos-14
            python-version: "3.12"
            pyscf-version: "2.11"

    name: "Python=${{ matrix.python-version }} & PySCF=${{ matrix.pyscf-version }} @ ${{ matrix.runner }}"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        lfs: true

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
      with:
        environment-file: environment-cpu.yml
        environment-name: skala
        # Recreate native environments per runner to avoid restoring CPU-specific binaries.
        cache-environment: false
        cache-downloads: true
        create-args: >-
          python=${{ matrix.python-version }}

    # Keep PySCF on PyPI: its wheels bundle XCFun instead of introducing Conda's
    # pybind11 ABI 4 requirement, which conflicts with PyTorch >=2.9's ABI 11.
    - name: Install matrix PySCF version
      run: python -m pip install "pyscf==${{ matrix.pyscf-version }}"
      shell: micromamba-shell {0}

    - name: Install package in development mode
      run: |
        pip install -e . --no-deps
      shell: micromamba-shell {0}

    - name: Run tests with coverage
      run: >-
        pytest
        -v
        --doctest-modules
        --cov=skala --cov-report=xml --cov-report=term-missing --cov-report=html
        --durations=50 --durations-min=1.0
        src/skala/
        tests/
      shell: micromamba-shell {0}

    - name: Print CPU diagnostics on failure
      if: ${{ failure() }}
      uses: ./.github/actions/cpu-diagnostics

  gpu-test:
    runs-on: microsoft-skala-gpu-pool
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d # v1
      with:
        environment-file: environment-gpu.yml
        environment-name: skala-gpu
        cache-environment: false
        cache-downloads: true

    - name: Install package in development mode
      run: |
        pip install -e . --no-deps
      shell: micromamba-shell {0}

    - name: Verify CUDA is available
      run: |
        python -c "import cupy, torch; assert torch.cuda.is_available(); cupy.linalg.norm(cupy.arange(3.0)).get()"
      shell: micromamba-shell {0}

    - name: Run GPU tests
      run: >-
        pytest
        -v
        -m "gpu and not profiling and not model_benchmark"
        tests/
      shell: micromamba-shell {0}

    - name: Run GPU doctests
      run: >-
        pytest
        -v
        --doctest-modules
        src/skala/gpu4pyscf/
      shell: micromamba-shell {0}

  profiling:
    name: "Profiling (Python=3.12 & PySCF=2.13.1)"
    runs-on: ubuntu-latest
    needs:
      - lint
    env:
      OMP_NUM_THREADS: 4
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d # v1
      with:
        environment-file: environment-cpu.yml
        environment-name: skala
        # Recreate native environments per runner to avoid restoring CPU-specific binaries.
        cache-environment: false
        cache-downloads: true
        create-args: >-
          python=3.12

    # Keep PySCF on PyPI for the same XCFun/pybind11 ABI reason as the test matrix.
    - name: Install profiling PySCF version
      run: python -m pip install "pyscf==2.13.1"
      shell: micromamba-shell {0}

    - name: Install package in development mode
      run: |
        pip install -e . --no-deps
      shell: micromamba-shell {0}

    - name: Run profiling tests
      run: pytest -v -m profiling
      shell: micromamba-shell {0}
