name: GauXC examples

on:
  push:
    branches: [main]
    paths: &gauxc-paths
      - '.github/workflows/examples.yml'
      - 'examples/c/gauxc_integration/**'
      - 'examples/cpp/gauxc_integration/**'
      - 'examples/fortran/gauxc_integration/**'
      - 'pixi.lock'
      - 'pixi.toml'
  pull_request:
    branches: [main]
    paths: *gauxc-paths

permissions:
  contents: read

jobs:
  skala-checkpoint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        environments: assets
        locked: true
        cache: false

    - name: Download checkpoint
      run: pixi run -e assets download-checkpoint

    - name: Upload checkpoint
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: skala-checkpoint
        path: skala-1.1-rev1.fun

  gauxc:
    needs:
      - skala-checkpoint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["openmp", "mpi"]
        gauxc: ["release", "main"]
        example: ["cpp", "c", "fortran"]
        include:
          - toolchain: openmp
            example: cpp
            environment: gauxc-openmp
          - toolchain: openmp
            example: c
            environment: gauxc-openmp
          - toolchain: openmp
            example: fortran
            environment: gauxc-openmp-fortran
          - toolchain: mpi
            example: cpp
            environment: gauxc-mpi
          - toolchain: mpi
            example: c
            environment: gauxc-mpi
          - toolchain: mpi
            example: fortran
            environment: gauxc-mpi-fortran

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        path: skala

    - name: Print CPU diagnostics
      uses: ./skala/.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.75.0
        working-directory: skala
        environments: ${{ matrix.environment }}
        locked: true
        cache: false

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: wavefunction91/gauxc
        ref: skala
        path: gauxc

    - name: Configure GauXC
      if: ${{ matrix.gauxc == 'release' }}
      run: >-
        pixi run --manifest-path skala/pixi.toml
        -e ${{ matrix.environment }}
        gauxc-configure ${{ matrix.example }} ${{ matrix.toolchain }}

    - name: Build GauXC
      if: ${{ matrix.gauxc == 'release' }}
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-build

    - name: Install GauXC
      if: ${{ matrix.gauxc == 'release' }}
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-install

    - name: Configure project
      run: >-
        pixi run --manifest-path skala/pixi.toml
        -e ${{ matrix.environment }}
        gauxc-example-configure ${{ matrix.example }} ${{ matrix.toolchain }}

    - name: Build project
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-example-build

    - name: Install project
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-example-install

    - name: Run example
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-run-tpss

    - name: Download checkpoint
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: skala-checkpoint
        path: skala

    - name: Run example
      run: pixi run --manifest-path skala/pixi.toml -e ${{ matrix.environment }} gauxc-run-checkpoint
