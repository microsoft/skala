name: "Model examples"

on:
  push:
    branches: [main]
    paths: &model-example-paths
      - '.github/workflows/model-examples.yml'
      - 'model/examples/**'
      - 'model/src/**'
      - 'pixi.lock'
      - 'pixi.toml'
      - 'skala/src/skala/**'
  pull_request:
    branches: [main]
    paths: *model-example-paths

permissions:
  contents: read

jobs:
  skala-checkpoint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.78.0
        environments: assets
        activate-environment: true
        locked: true
        cache: false

    - name: Download checkpoint
      run: >-
        hf download microsoft/skala-1.1 skala-1.1-rev1.fun --local-dir .

    - name: Upload checkpoint
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: skala-checkpoint
        path: skala-1.1-rev1.fun

  pt-features:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.78.0
        environments: default
        activate-environment: true
        locked: true
        cache: false

    - name: Generate features
      run: >-
        python model/examples/cpp/cpp_integration/prepare_inputs.py
        --output-dir features

    - name: Upload features
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pt-features
        path: features

  cpp:
    runs-on: ubuntu-latest
    needs:
      - pt-features
      - skala-checkpoint

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.78.0
        environments: cpp-integration
        activate-environment: true
        locked: true
        cache: false

    - name: Configure and build project
      run: |
        cmake -B build_example -S model/examples/cpp/cpp_integration -G Ninja
        cmake --build build_example

    - name: Download features
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: pt-features
        path: features

    - name: Download checkpoint
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: skala-checkpoint
        path: .

    - name: Run example
      run: |
        ./build_example/skala_cpp_integration \
          ./skala-1.1-rev1.fun ./features

  ftorch:
    runs-on: ubuntu-latest
    needs:
      - pt-features
      - skala-checkpoint

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        pixi-version: v0.78.0
        environments: ftorch
        activate-environment: true
        locked: true
        cache: false

    - name: Configure, build, and install project
      run: |
        cmake -B build_example -S model/examples/fortran/ftorch_integration -G Ninja \
          -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
        cmake --build build_example
        cmake --install build_example

    - name: Download features
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: pt-features
        path: features

    - name: Download checkpoint
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: skala-checkpoint
        path: .

    - name: Run example
      run: Skala ./skala-1.1-rev1.fun ./features
