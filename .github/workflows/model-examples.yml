name: "Model examples"

on:
  push:
    branches: [main]
    paths: &model-example-paths
      - '.github/workflows/model-examples.yml'
      - '.github/actions/setup-pixi/**'
      - 'model/examples/**'
      - 'model/src/**'
      - 'pixi.lock'
      - 'pixi.toml'
      - 'skala/src/skala/**'
  pull_request:
    branches: [main]
    paths: *model-example-paths

permissions:
  contents: read

jobs:
  skala-checkpoint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: assets

    - name: Download checkpoint
      run: >-
        hf download microsoft/skala-1.1 skala-1.1-rev1.fun
        --revision 99b5ed87e5f69d9216e1f9e30148b922eaea1241 --local-dir .

    - name: Upload checkpoint
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: skala-checkpoint
        path: skala-1.1-rev1.fun

  cpp:
    runs-on: ubuntu-latest
    needs:
      - skala-checkpoint

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: cpp-integration

    - name: Configure and build project
      run: |
        cmake -B build_example -S model/examples/cpp/cpp_integration -G Ninja
        cmake --build build_example

    - name: Generate features
      run: python model/examples/prepare_inputs.py --output-dir features

    - name: Download checkpoint
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: skala-checkpoint
        path: .

    - name: Run example
      run: |
        ./build_example/skala_cpp_integration \
          ./skala-1.1-rev1.fun ./features

  ftorch:
    runs-on: ubuntu-latest
    needs:
      - skala-checkpoint

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Print CPU diagnostics
      uses: ./.github/actions/cpu-diagnostics

    - name: Setup Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: ftorch

    - name: Configure, build, and install project
      run: |
        cmake -B build_example -S model/examples/fortran/ftorch_integration -G Ninja \
          -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
        cmake --build build_example
        ctest --test-dir build_example --output-on-failure
        cmake --install build_example

    - name: Generate features
      run: python model/examples/prepare_inputs.py --output-dir features

    - name: Download checkpoint
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: skala-checkpoint
        path: .

    - name: Run example
      run: Skala ./skala-1.1-rev1.fun ./features
