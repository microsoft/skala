[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skala-model"
version = "2026.9"
description = "Trainable model definition for the Skala exchange-correlation functional"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "e3nn",
    "opt_einsum_fx",
    "skala>=2026.9,<2027",
    "torch>=2.12,<2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skala_model"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/skala_model",
]