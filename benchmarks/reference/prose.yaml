plots:
  xc_eval: |
    In all environments and for all functionals, the cost scales roughly linearly with an initial onset, and Skala's evaluation is ~1.5 orders of magnitude more expensive than the traditional functionals.
    As shown below, this much higher cost doesn't translate into a higher total cost, because the XC grid evaluation is only a small part of the total SCF cycle.
    The relative onset positions of Skala and the traditional functionals on CPU vs GPU differ, driving Skala's total SCF overhead on CPU for small molecules (see below).
  numint: |
    On a GPU, all functionals scale the same way, with the meta-GGAs being ~2x as expensive as the GGA.
    on a CPU, the relative cost of Skala dominates for small molecules, introducing a ~10x overhead for the smallest molecules, which disappears by ~15–20 non-hydrogen atoms.
    The slightly better asymptotic scaling of Skala is the result of a marginally more efficient contraction of the XC potential in the Skala implementation.
  jk: |
    Hybrid functionals use DF-JK with precomputed 3-center integrals, while non-hybrids use direct DF-J.
    This results in a lower cost of DF-JK for the smallest molecules, while the asymptotic scaling of Coulomb onlyu is much better than of Coulomb and exchange.
  cycle: |
    Combing all above together, as a GGA hybrid B3LYP is 1.5–2x cheaper for small molecules, while as non-hybrids Skala and r2SCAN get cheaper for large molecules.
    In addition, Skala features the same overhead on CPU for small molecules as seen in the XC quadrature.
  iterations: |
    For all functionals we observe a very slow growth of the iteration count with system size.
    For all functionals, all basis sets, and all environments, we observe outliers for the largest systems, which took several times more iterations to converge.
  total: |
    The measurements here are noiser than the per-iteration costs, because they combine the per-iteration cost with the iteration count.
  setup: |
    Containing both one XC quadrature and the 3-center integral build, the setup cost shows similar characteristics as the SCF iteraction cost.
  startup: |-
    Three costs are paid before a calculation can start, and none of them appears in the timings above. The first is the **machine cold start**. The first calculation on a fresh machine compiles the CUDA kernels into the CuPy cache on disk and reads the two gigabytes of PyTorch shared libraries into the operating system's page cache; every later process finds both already there. On this sweep that costs ~13 s. Neither is specific to quantum chemistry: the libraries are PyTorch's own, and all CuPy kernels an SCF compiles are CuPy's generic array ops.

    The second is **process start-up**: creating the CUDA context and its library handles, executing the Python imports, and moving the functional onto the device. On the A100 it is ~8 s for all functionals. On a CPU the traditional functionals pay less than a second, while Skala pays ~7 s on 16 threads and ~13 s on two, because it is the only one of the four that loads PyTorch.

    The third is the **first-evaluation overhead**, paid the first time the exchange-correlation functional runs on a given system. This includes TorchScript compilation, roughly fixed at 1–2 s, compilation of some GPU4PySCF custom kernels, and GPU memory allocation.
