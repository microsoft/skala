[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "skala"
version = "2026.9"
description = "Skala Exchange Correlation Functional"
license-file = "LICENSE.txt"
readme = "README.md"
repository = "https://github.com/microsoft/skala"
documentation = "https://microsoft.github.io/skala"
publish = false

[package.build]
backend = { name = "pixi-build-python", version = "0.8.*", channels = ["https://prefix.dev/conda-forge"] }

[package.build.config]
ignore-pypi-mapping = true

[package.host-dependencies]
hatchling = "*"
python = ">=3.11,<3.14"

# PySCF and dispersion packages intentionally remain PyPI-only environment
# dependencies because conda PySCF introduces an incompatible XCFun ABI.
[package.run-dependencies]
ase = "*"
huggingface_hub = "*"
numpy = "*"
python = ">=3.11,<3.14"
pytorch = ">=2.12,<2.14"