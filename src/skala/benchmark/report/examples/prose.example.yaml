# Example prose file for `python -m skala.benchmark report`.
# Every field is optional. Values are rendered with CommonMark; inline
# `$...$` expressions are rendered with the bundled KaTeX asset.

title: SCF cost scaling across two compute environments
author: Benchmark Team
date: 2026-07-16
abstract: >
  This report compares exchange-correlation evaluation and end-to-end SCF cost
  across the collected CPU and GPU environments. Fixed plot domains make changes
  in scaling and absolute runtime directly comparable.

intro: |
  Each point is a converged calculation from the same molecular sweep. The report
  separates the standalone model, numerical integration, convergence iterations,
  and total kernel time so that different sources of runtime growth can be
  interpreted independently.

comparison:
  intro: |
    Hardware and software metadata were recorded with each sweep. Environment
    labels identify the controls, while the cards retain the detailed configuration
    needed to interpret performance differences.
  environments:
    gpu-a100: |
      Accelerator run using the GPU-enabled numerical-integration path.
    cpu-epyc: |
      CPU run using the host numerical libraries listed in the card.
  notes:
    - Compare only runs produced with equivalent numerical settings and convergence
      thresholds.

plots:
  model: |
    The standalone model time is shown against both AO count and grid size. The
    grid-size view most directly reflects the number of density samples processed.
  numint: |
    Numerical integration includes AO and grid work in addition to the functional.
    Divergence between AO-count and grid-size slopes indicates which dimension is
    driving the observed growth.
  iterations: |
    Stable iteration counts indicate that runtime growth is primarily caused by
    more expensive iterations rather than increasingly difficult convergence.
  total: |
    Total kernel time combines per-iteration work with the convergence trajectory.
    Read it alongside the iteration panel before attributing a trend to either
    implementation cost or SCF behavior.

closing: |
  Piecewise log-log fits summarize local scaling exponents. Interpret fitted slopes
  together with the measured points and the number of systems in each fitted range.
