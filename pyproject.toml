[tool.mypy]
strict = true
no_namespace_packages = true
python_version = "3.11"
exclude = ["build/", "docs/site/_build/", "htmlcov/", "third_party/"]

[[tool.mypy.overrides]]
module = [
    "cupy",
    "cupy.*",
    "e3nn",
    "e3nn.*",
    "gpu4pyscf",
    "gpu4pyscf.*",
    "h5py",
    "h5py.*",
    "opt_einsum_fx",
    "opt_einsum_fx.*",
    "pyscf",
    "pyscf.*",
]
ignore_missing_imports = true


[tool.ruff]
target-version = "py311"
src = ["skala/", "model/", "gauxc/", "docs/"]
exclude = ["build", "docs/site/_build", "third_party"]

[tool.ruff.lint]
select = [
  "E4", # pycodestyle import errors
  "E7", # pycodestyle statement errors
  "E9", # pycodestyle runtime errors
  "F", # Pyflakes
  "B", # flake8-bugbear
  "D417", # undocumented-param in docstring
  "I", # isort
  "UP", # pyupgrade
]
extend-ignore = [
  "UP015", # redundant-open-modes
  "E741", # variable name l
]

[tool.ruff.lint.isort]
detect-same-package = true

[tool.black]
line-length = 100

[tool.pytest.ini_options]
timeout = 300
addopts = "-m 'not profiling and not benchmark and not model_benchmark'"
pythonpath = [".", "skala/src", "gauxc/src"]
testpaths = ["skala/tests", "model/tests", "gauxc/tests", "docs/benchmark/tests"]
markers = [
    "benchmark: performance measurements collected by pytest-benchmark",
    "gpu: requires a CUDA-capable GPU and GPU test dependencies",
    "model_benchmark: traced-model forward/backward accuracy, runtime, and memory gates",
    "profiling: single-call performance workloads intended for profilers",
]
filterwarnings = [
    "error",
    # Supported PyTorch versions deprecate `torch.jit.load`; Skala's pretrained checkpoints
    # are TorchScript archives, so `skala.functional.load` still uses it.
    'ignore:`torch\.jit\.load` is deprecated\. Please switch to `torch\.export`\.:DeprecationWarning',
    'ignore:`torch\.jit\.script` is deprecated\. Please switch to `torch\.compile` or `torch\.export`\.:DeprecationWarning',
    'ignore:`torch\.jit\.save` is deprecated\. Please switch to `torch\.export`\.:DeprecationWarning',
    'ignore:`torch\.jit\.save` is not supported in Python 3\.14+ and may break\. Please switch to `torch\.export`\.:DeprecationWarning',
    'ignore:`torch\.jit\.trace_method` is deprecated\. Please switch to `torch\.compile` or `torch\.export`\.:DeprecationWarning',
    # From gpu4pyscf if cutensor is not available
    'ignore:using cupy as the tensor contraction engine\.:UserWarning',
    # Deprecation warning in huggingface_hub package
    'ignore:hf_xet\.download_files\(\) is deprecated\. Use XetSession\(\)\.new_file_download_group\(\)\.start_download_file\(\) instead\.:DeprecationWarning',
    # ASE directly assigns array shapes in `Atoms.new_array`, deprecated by NumPy 2.5.
    'ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\.:DeprecationWarning',
    # Upstream deprecations in PySCF / GPU4PySCF are outside this project's control.
    'ignore::DeprecationWarning:pyscf\..*',
    'ignore::DeprecationWarning:gpu4pyscf\..*',
]
