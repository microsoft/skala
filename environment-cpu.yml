name: skala-cpu
channels:
  - conda-forge
dependencies:
  - ase
  - e3nn
  - h5py
  - jinja2
  - markdown-it-py
  - numpy <2.5
  - opt_einsum_fx
  - pandas
  - pyarrow
  - pyyaml
  - python >=3.11,<3.14
  - pytorch >=2.9 cpu_*
  - scipy
# Testing and development
  - memray
  - pre-commit
  - pytest
  - pytest-benchmark
  - pytest-cov
  - pytest-randomly
  - pytest-timeout
  - ruff
  - mypy >=2
  - pip:
    - huggingface_hub
    - pandas-stubs
    - pyarrow-stubs >=20,<21
    # Conda PySCF pulls XCFun with pybind11 ABI 4, conflicting with PyTorch >=2.9's ABI 11.
    # PyPI wheels bundle XCFun and avoid that solver conflict.
    - pyscf >=2.11,<2.15
    # Use its bundled DFT-D3 library instead of installing a second, incompatible copy.
    - pyscf-dispersion
    - scipy-stubs
    - types-PyYAML
