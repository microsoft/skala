name: skala-gpu
channels:
  - conda-forge
dependencies:
  - ase
  - dftd3-python
  - e3nn
  - h5py
  - jinja2
  - markdown-it-py
  - numpy
  - opt_einsum_fx
  - pandas
  - pyarrow
  - pyyaml
  - python
  - pytorch-gpu >=2.9  # CUDA-enabled PyTorch for Skala model inference
  - scipy
  - cuda-version >=12,<13  # Constrains conda CUDA packages to CUDA 12
  - cuda-nvrtc >=12,<13  # Runtime compiler used by CuPy for GPU kernels
  - cuda-cudart-dev >=12,<13  # Matching CUDA headers for CuPy kernel compilation
  - cutensor >=2  # Tensor-contraction backend used by GPU4PySCF
  # Testing and development dependencies
  - pre-commit
  - pytest
  - pytest-benchmark
  - pytest-cov
  - pytest-randomly
  - pytest-timeout
  - ruff
  - mypy >=2
  - pip:
    - huggingface_hub
    - pandas-stubs
    - pyarrow-stubs >=20,<21
    # Conda PySCF pulls XCFun with pybind11 ABI 4, conflicting with PyTorch >=2.9's ABI 11.
    # PyPI wheels bundle XCFun and avoid that solver conflict.
    - pyscf >=2.8,<2.14
    - scipy-stubs
    - types-PyYAML
    - gpu4pyscf-cuda12x >=1.8,<1.9  # GPU-accelerated PySCF backend used by Skala
